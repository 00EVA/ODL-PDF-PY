[project]
name = "odl-pdf"
version = "0.1.0"
description = "OpenDataLoader-PDF — native Python rewrite (Track B: pikepdf + pypdf)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pikepdf>=10.7.2",
    "pypdf>=6.12.2",
    # Lets pypdf decrypt password-protected/encrypted PDFs (e.g. supplier
    # certs). Pure-wheel, keeps clone-and-go. Without it, encrypted inputs
    # raise DependencyError instead of extracting.
    "cryptography>=3.1",
]

[project.optional-dependencies]
# Hybrid AI mode: page rendering (pypdfium2) + AWS Bedrock vision (boto3).
# Kept optional so the core parser has no AI/cloud dependencies.
hybrid = [
    "boto3>=1.35",
    "pypdfium2>=4.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "boto3>=1.35",
    "pypdfium2>=4.30",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/odl_pdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
